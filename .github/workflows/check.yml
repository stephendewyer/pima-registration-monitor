name: Check Pima FastTrack Registration

on:
  # Run every day at 8:00 AM Arizona (15:00 UTC during daylight saving time)
  # schedule:
  #   - cron: "0 15 * * *"

  # Allow manual runs from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-registration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run registration monitor
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node check.mjs

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add previous.json

          if ! git diff --cached --quiet; then
            git commit -m "Update registration snapshot"
            git push
          fi